<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>导出JPG格式</title>
</head>

<body>
    <div style="margin:10px; width:330px;">
        <div style="margin-bottom:12px; font-size:13px; line-height:1.6; color:#333;">
            <p><strong>说明：</strong>纯前端本地转换，生成 JPG 图片无需上传服务器，保护乐谱隐私。</p>
        </div>
        <div style="text-align:center; margin-bottom:15px;">
            <div style="margin-bottom:12px; text-align:left;">
            图片清晰度：
            <select id="jpg_dpi_select" style="padding:4px; font-size:13px;">
              <option value="1.5">标准清晰度（适合手机分享与网络发布）</option>
              <option value="3">DPI 300 超清（适合印刷出版）</option>
            </select>
            </div>
            <input type="button" id="btnExportJpg" onClick="doExportJpg();" value="我知道了，导出JPG图片" style="padding:6px 16px; font-size:14px; font-weight:bold; cursor:pointer;">
        </div>
    </div>
    
    <script>
        function doExportJpg() {
            var scale = $("#jpg_dpi_select").val();
            var btn = document.getElementById("btnExportJpg");
            if (btn) {
                btn.disabled = true;
                btn.value = "JPG导出中，请稍等...";
            }
            if (typeof clientExportJpg === 'function') {
                clientExportJpg(scale);
            } else {
                alert("未找到导出组件");
            }
        }
    </script>
</body>
</html>
